name: Build DeyLauncher

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check whether the shared Friends backend is configured
        env:
          DEYLAUNCHER_GITHUB_PROPS: ${{ secrets.DEYLAUNCHER_GITHUB_PROPS }}
        run: |
          if [ -z "$DEYLAUNCHER_GITHUB_PROPS" ]; then
            echo "::warning title=No shared Friends backend::Repository secret DEYLAUNCHER_GITHUB_PROPS is not set, so Friends/capes/option-kits will show 'not set up' in this build."
          else
            echo "Shared Friends backend: configured (the value is never printed)."
          fi

      - name: Build
        env:
          DEYLAUNCHER_GITHUB_PROPS: ${{ secrets.DEYLAUNCHER_GITHUB_PROPS }}
        run: ./gradlew clean prepareJpackage

      - name: Create Linux app-image
        run: |
          rm -rf dist
          mkdir -p dist

          # Discover the fat jar the build actually produced (it carries the real version),
          # instead of hardcoding a jar name that goes stale every time the version bumps.
          MAIN_JAR=$(ls build/jpackage-input/DeyLauncher-*.jar 2>/dev/null | xargs -n1 basename)
          if [ -z "$MAIN_JAR" ]; then
            echo "No DeyLauncher fat jar found in build/jpackage-input" >&2
            exit 1
          fi
          echo "Packaging main jar: $MAIN_JAR"

          jpackage \
            --type app-image \
            --input build/jpackage-input \
            --module-path build/jpackage-fx \
            --add-modules java.se,jdk.crypto.ec,jdk.unsupported,javafx.controls,javafx.graphics \
            --main-jar "$MAIN_JAR" \
            --main-class com.deylauncher.ui.LauncherApp \
            --name DeyLauncher \
            --icon src/main/resources/app-icon.png \
            --dest dist \
            --java-options "-Djava.awt.headless=false" \
            --java-options "--enable-native-access=javafx.graphics,ALL-UNNAMED"

      - name: Create Linux archive
        run: |
          cd dist
          tar -czf DeyLauncher-Linux.tar.gz DeyLauncher

      - name: Upload Linux build
        uses: actions/upload-artifact@v5
        with:
          name: DeyLauncher-Linux
          path: dist/DeyLauncher-Linux.tar.gz


  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check whether the shared Friends backend is configured
        shell: pwsh
        env:
          DEYLAUNCHER_GITHUB_PROPS: ${{ secrets.DEYLAUNCHER_GITHUB_PROPS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEYLAUNCHER_GITHUB_PROPS)) {
            Write-Warning 'Repository secret DEYLAUNCHER_GITHUB_PROPS is not set, so Friends/capes/option-kits will show ''not set up'' in this build.'
          } else {
            Write-Host 'Shared Friends backend: configured (the value is never printed).'
          }

      - name: Build
        env:
          DEYLAUNCHER_GITHUB_PROPS: ${{ secrets.DEYLAUNCHER_GITHUB_PROPS }}
        run: .\gradlew.bat clean prepareJpackage

      - name: Create Windows app-image
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Discover the fat jar the build actually produced (it carries the real version),
          # instead of hardcoding a jar name that goes stale every time the version bumps.
          $MAIN_JAR = (Get-ChildItem build/jpackage-input -Filter 'DeyLauncher-*.jar' | Select-Object -First 1).Name
          if (-not $MAIN_JAR) {
            Write-Error 'No DeyLauncher fat jar found in build/jpackage-input'
            exit 1
          }
          echo "Packaging main jar: $MAIN_JAR"

          jpackage `
            --type app-image `
            --input build/jpackage-input `
            --module-path build/jpackage-fx `
            --add-modules java.se,jdk.crypto.ec,jdk.unsupported,javafx.controls,javafx.graphics `
            --main-jar $MAIN_JAR `
            --main-class com.deylauncher.ui.LauncherApp `
            --name DeyLauncher `
            --icon src/main/resources/app-icon.ico `
            --dest dist `
            --java-options '--enable-native-access=javafx.graphics,ALL-UNNAMED'

      - name: Create Windows archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/DeyLauncher `
            -DestinationPath dist/DeyLauncher-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DeyLauncher-Windows
          path: dist/DeyLauncher-Windows.zip
